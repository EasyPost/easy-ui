version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    versioning-strategy: increase
    ignore:
      # Keep Node's type definitions on the same major as the Node runtime
      # (.nvmrc). Newer majors type-check APIs that don't exist at runtime.
      # Bump this together with .nvmrc when upgrading Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # Families that release in lockstep and must stay on matching versions
    # arrive as one PR instead of several out-of-sync ones.
    groups:
      react-aria:
        patterns:
          - "react-aria"
          - "react-aria-components"
          - "react-stately"
          - "@react-aria/*"
          - "@react-stately/*"
          - "@react-types/*"
          - "@internationalized/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
          - "eslint-plugin-storybook"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-is"
          - "@types/react"
          - "@types/react-dom"
          - "@types/react-is"
      material-symbols:
        patterns:
          - "@material-symbols/*"
      eslint:
        patterns:
          - "eslint"
          - "@eslint/*"
      turbo:
        patterns:
          - "turbo"
          - "eslint-plugin-turbo"
    # # Disable version checks while keeping dependabot config
    # open-pull-requests-limit: 0
    # ignore:
    #   # Ignore updates to packages that start with 'aws'
    #   # Wildcards match zero or more arbitrary characters
    #   - dependency-name: "aws*"
    #   # Ignore some updates to the 'express' package
    #   - dependency-name: "express"
    #     # Ignore only new versions for 4.x and 5.x
    #     versions: ["4.x", "5.x"]
    #   # For all packages, ignore all patch updates
    #   - dependency-name: "*"
    #     update-types: ["version-update:semver-patch"]
