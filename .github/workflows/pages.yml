name: Documentation site

on:
  push:
    branches:
      - main
      - experiment/modular-echarts
      - feat/network-intelligence-maps
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - ".storybook/**"
      - "docs-site/**"
      - "easy-ui-react/src/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-docs.mjs"
      - "scripts/check-docs-site.mjs"
      - "scripts/preview-metrics/**"
      - "scripts/preview-maps/**"
      - "typedoc.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deployment' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(github.event_name == 'pull_request' && '["preview"]' || '["charts","network-maps"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Build both review branches for every deployment: Pages replaces the
          # whole site, so publishing one PR must preserve the other PR's preview.
          ref: ${{ matrix.site == 'preview' && github.sha || matrix.site == 'network-maps' && (github.ref_name == 'feat/network-intelligence-maps' && github.sha || 'feat/network-intelligence-maps') || (github.ref_name == 'feat/network-intelligence-maps' && 'experiment/modular-echarts' || github.sha) }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Install chart gallery dependencies
        run: npm ci --prefix scripts/preview-metrics --no-audit --no-fund
      - name: Install map gallery dependencies
        if: hashFiles('scripts/preview-maps/package-lock.json') != ''
        run: npm ci --prefix scripts/preview-maps --no-audit --no-fund
      - name: Build documentation and examples
        run: npm run build:docs
      - name: Verify documentation outputs
        run: node scripts/check-docs-site.mjs
      - name: Record source revision
        run: git rev-parse HEAD > docs-site/revision.txt
      - name: Upload documentation build
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.site == 'preview' && 'easy-ui-documentation-site' || format('docs-{0}', matrix.site) }}
          path: docs-site
          include-hidden-files: true
          if-no-files-found: error

  assemble:
    outputs:
      map_revision: ${{ steps.revisions.outputs.map_revision }}
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download chart documentation
        uses: actions/download-artifact@v4
        with:
          name: docs-charts
          path: published-site
      - name: Download map documentation
        uses: actions/download-artifact@v4
        with:
          name: docs-network-maps
          path: published-site/network-maps
      - name: Verify both previews are included
        id: revisions
        run: |
          test -f published-site/index.html
          test -f published-site/storybook/index.html
          test -f published-site/api/index.html
          test -f published-site/comparisons/modular/portfolio/index.html
          test -f published-site/network-maps/index.html
          test -f published-site/network-maps/storybook/index.html
          test -f published-site/network-maps/api/index.html
          test -f published-site/network-maps/maps/index.html
          touch published-site/.nojekyll
          echo "map_revision=$(cat published-site/network-maps/revision.txt)" >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: published-site

  deploy:
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    if: github.event_name != 'pull_request'
    needs: assemble
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation site
        id: deployment
        uses: actions/deploy-pages@v4

  verify-hosted-maps:
    if: github.event_name != 'pull_request'
    needs: [assemble, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.assemble.outputs.map_revision }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm
          cache-dependency-path: scripts/preview-maps/package-lock.json
      - name: Install map browser checks
        run: npm ci --no-audit --no-fund
        working-directory: scripts/preview-maps
      - name: Install Chrome
        run: npx playwright install --with-deps chrome
        working-directory: scripts/preview-maps
      - name: Check published map interactions, assets and accessibility
        run: npm run capture
        working-directory: scripts/preview-maps
        env:
          MAP_BROWSER: chrome
          MAP_BASE_URL: ${{ needs.deploy.outputs.page_url }}network-maps/maps/
      - name: Upload hosted map evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-maps-hosted-chrome
          path: scripts/preview-maps/screenshots/
          if-no-files-found: warn
