name: Documentation site

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - ".github/workflows/pages.yml"
      - ".storybook/**"
      - "docs-site/**"
      - "easy-ui-react/src/**"
      - "package.json"
      - "scripts/preview-metrics/**"
      - "typedoc.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
      - name: Install repository dependencies
        run: npm ci
      - name: Build tokens and icons
        run: |
          npm run build:tokens
          npm run build:icons
      - name: Install chart gallery dependencies
        run: npm ci --prefix scripts/preview-metrics --no-audit --no-fund
      - name: Build Storybook, API reference and chart portfolio
        run: npm run build:docs
        env:
          EASY_UI_PREVIEW_BASE: ./
      - name: Verify documentation outputs
        run: |
          test -f docs-site/index.html
          test -f docs-site/storybook/index.html
          test -f docs-site/api/index.html
          test -f docs-site/comparisons/index.html
          touch docs-site/.nojekyll
      - name: Upload PR documentation preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: easy-ui-documentation-site
          path: docs-site
          if-no-files-found: error
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs-site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy documentation site
        id: deployment
        uses: actions/deploy-pages@v4
