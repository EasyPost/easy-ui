name: "Chromatic"
on: push
jobs:
  deployment:
    runs-on: ubuntu-latest
    if: ${{ github.triggering_actor != 'dependabot[bot]' }}
    permissions:
      contents: write
      statuses: write
    steps:
      - uses: actions/checkout@v1
      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v3
        with:
          node-version-file: ".nvmrc"
      - name: Install dependencies
        run: npm i
      # Builds every workspace, not just tokens and icons. Storybook's docgen
      # resolves easy-ui-react's components through the project reference in
      # the root tsconfig, which points at easy-ui-react/dist. Without those
      # emitted .d.ts files it silently skips most components, dropping their
      # props tables and leaving minified names in the generated code samples.
      - name: Build
        run: npm run build
      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@v1
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: "build:storybook"
      - name: Generate Storybook preview
        uses: actions/github-script@v6
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: "success",
              target_url: "${{ steps.chromatic.outputs.storybookUrl }}",
              description: "Storybook preview generated!",
              context: "Chromatic / storybook (push)"
            });
