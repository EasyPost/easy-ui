name: Metric examples

on:
  pull_request:
    paths:
      - "easy-ui-react/src/MetricCard/**"
      - "easy-ui-react/src/Sparkline/**"
      - "scripts/preview-metrics/**"
      - ".github/workflows/metric-examples.yml"

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scripts/preview-metrics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run capture
      - uses: actions/upload-artifact@v4
        with:
          name: metric-card-examples
          path: |
            scripts/preview-metrics/dist/
            scripts/preview-metrics/screenshots/
          if-no-files-found: error
